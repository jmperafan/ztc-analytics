# ──────────────────────────────────────────────────────────────────────────────
# COURT USAGE
#
# First authored in Apache Ossie and converted to the latest YAML spec; this
# file is now the source of truth. dbt v2 can't read Ossie documents yet, so
# interchange runs one way: `uv run scripts/ossie_bridge.py export`.
# ──────────────────────────────────────────────────────────────────────────────

models:
- name: ossie_court_usage
  description: One row per court slot, excluding winter-break days.
  semantic_model:
    enabled: true
    name: court_usage
  agg_time_dimension: reservation_date
  columns:
  - name: slot_id
    description: 'Surrogate key for a slot: court, date and start time are unique together.'
    entity:
      type: primary
      name: slot_id
  - name: reservation_date
    description: Calendar date of the slot.
    granularity: day
    dimension:
      type: time
      label: Reservation date
  - name: court_number
    description: Tennis court number (1-5).
    dimension:
      type: categorical
      label: Court
  - name: start_hour
    description: Hour of day the slot starts (0-23).
    dimension:
      type: categorical
      label: Start hour
  - name: reservation_type
    description: What the slot was used for. Beschikbaar = available, Gesloten = closed, Onderhoud = maintenance;
      everything else is a booking.
    dimension:
      type: categorical
      label: Reservation type
  metrics:
  - name: court_slots
    label: Court slots
    description: All court slots in the period, whatever their status.
    type: simple
    agg: count
    expr: start_time
  - name: open_slots
    label: Open slots
    description: 'Slots the courts were open for play: all slots except closed and maintenance.'
    type: simple
    agg: sum_boolean
    expr: NOT reservation_type IN ('Gesloten', 'Onderhoud')
  - name: booked_slots
    label: Booked slots
    description: Slots used for any booking, lesson, match, tournament or rental.
    type: simple
    agg: sum_boolean
    expr: NOT reservation_type IN ('Gesloten', 'Onderhoud', 'Beschikbaar')
metrics:
- name: court_utilization
  label: Court utilization
  description: Booked slots as a share of open slots.
  type: ratio
  numerator: booked_slots
  denominator: open_slots
